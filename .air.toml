#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main -v ./cmd/home "
full_bin="LOG_LEVEL=info   CONFIG_FILE=config.dev.yaml ./tmp/main"
# entrypoint = ["./tmp/main"]
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["tmp", "vendor", "testdata", "docs", "script", "test", "tool"]
delay = 1000

[log]
time = true

[misc]
clean_on_exit = true
